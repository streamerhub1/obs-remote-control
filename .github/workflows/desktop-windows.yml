name: Desktop Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: streamerhub
          POSTGRES_PASSWORD: streamerhub_password
          POSTGRES_DB: streamerhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://streamerhub:streamerhub_password@localhost:5432/streamerhub_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-12345
      SESSION_SECRET: test-session-secret-12345
      TOKEN_ENCRYPTION_KEY: 1234567890123456789012345678901234567890123456789012345678901234
      TWITCH_CLIENT_ID: test_client_id
      TWITCH_CLIENT_SECRET: test_client_secret
      TWITCH_REDIRECT_URI: http://localhost:3000/api/v1/auth/callback
      DESKTOP_DEEP_LINK: streamerhub://auth/callback

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Version Matches Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($VERSION) does not match root package.json version ($PKG_VERSION)"
            exit 1
          fi
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$VERSION" != "$DESKTOP_VERSION" ]; then
            echo "Tag version ($VERSION) does not match desktop package.json version ($DESKTOP_VERSION)"
            exit 1
          fi
          echo "Version validation passed!"

      - name: Check Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Database Migrations
        run: pnpm --filter @obs-remote/database run migrate

      - name: Unit Tests
        run: pnpm test

      - name: Integration Tests
        run: pnpm test:integration

      - name: Build All
        run: pnpm build

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: verify
    env:
      PNPM_HOME: C:\p
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm (short store path)
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configure pnpm short store
        run: |
          pnpm config set store-dir C:\ps
          pnpm config set cache-dir C:\pc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icon assets
        run: node scripts/generate-icon.mjs

      - name: Build Desktop and Workspace Dependencies
        run: pnpm --filter @obs-remote/desktop... build
        env:
          VITE_STREAMERHUB_API_URL: ${{ vars.VITE_STREAMERHUB_API_URL }}
          VITE_STREAMERHUB_WS_URL: ${{ vars.VITE_STREAMERHUB_WS_URL }}

      - name: Package Windows Unpacked for Smoke Test
        run: pnpm --filter @obs-remote/desktop pack:dir

      - name: Runtime Smoke Test
        timeout-minutes: 5
        run: |
          Write-Host "Starting unpacked runtime smoke test..."
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $OutFile = "$PWD\smoke-test-out.log"
          $ErrFile = "$PWD\smoke-test-err.log"

          $Process = Start-Process -FilePath "apps\desktop\release\win-unpacked\StreamerHub.exe" -ArgumentList "--enable-logging" -PassThru -RedirectStandardOutput $OutFile -RedirectStandardError $ErrFile -NoNewWindow

          Start-Sleep -Seconds 15

          $ExitedEarly = $Process.HasExited
          $EarlyExitCode = $null

          if ($ExitedEarly) {
            $EarlyExitCode = $Process.ExitCode
          } else {
            taskkill /PID $Process.Id /T /F | Out-Null
          }

          Start-Sleep -Seconds 1
          $LogOutputOut = Get-Content $OutFile -Raw -ErrorAction SilentlyContinue
          $LogOutputErr = Get-Content $ErrFile -Raw -ErrorAction SilentlyContinue
          $LogOutput = $LogOutputOut + "`n" + $LogOutputErr

          Write-Host "=== SMOKE TEST LOGS ==="
          Write-Host $LogOutput
          Write-Host "======================="

          $ErrorDetected = $false
          if ($LogOutput -match "JavaScript error" -or $LogOutput -match "Cannot find module" -or $LogOutput -match "Cannot find package" -or $LogOutput -match "preload-error" -or $LogOutput -match "ERR_") {
            $ErrorDetected = $true
          }
          if ($LogOutput -match "VITE_STREAMERHUB_API_URL is required") {
            $ErrorDetected = $true
          }

          if ($ErrorDetected) {
            Write-Error "Smoke test failed: Critical error found in logs."
            exit 1
          }

          if ($ExitedEarly) {
            Write-Error "Smoke test failed: Application exited before the 15-second validation window. Exit code: $EarlyExitCode"
            exit 1
          }

          Write-Host "Runtime smoke test passed!"

      - name: Package Windows NSIS installer
        run: pnpm --filter @obs-remote/desktop dist:win:test
        env:
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''

      - name: Validate Installer Artifact
        run: |
          # For tag-based runs, use the tag name. For workflow_dispatch from a branch, read version from package.json.
          if ("$env:GITHUB_REF" -like 'refs/tags/v*') {
            $VERSION = $env:GITHUB_REF_NAME.Substring(1)
            # Ensure tag version matches package.json
            $PKG_VERSION = node -p "require('./apps/desktop/package.json').version"
            if ($VERSION -ne $PKG_VERSION) {
              Write-Error "Tag version ($VERSION) does not match desktop package.json version ($PKG_VERSION)"
              exit 1
            }
          } else {
            $VERSION = node -p "require('./apps/desktop/package.json').version"
          }
          Write-Host "Validating installer for version: $VERSION"
          $ExePath = "apps\desktop\release\StreamerHub-Setup-${VERSION}.exe"
          if (-Not (Test-Path $ExePath)) {
            Write-Error "Installer not found at $ExePath"
            exit 1
          }
          $ExeSize = (Get-Item $ExePath).Length
          if ($ExeSize -lt 50000000) {
            Write-Error "Installer is too small: $ExeSize bytes (expected > 50MB)"
            exit 1
          }
          if (Test-Path "apps\desktop\release\*Portable*.exe") {
            Write-Error "Portable installer found, should be disabled."
            exit 1
          }
          if (Test-Path "apps\desktop\release\OBS Remote Control*.exe") {
            Write-Error "Old OBS Remote Control exe found."
            exit 1
          }
          if (Test-Path "apps\desktop\release\Streamly*.exe") {
            Write-Error "Old Streamly exe found."
            exit 1
          }
          $Count = (Get-ChildItem -Path "apps\desktop\release" -Filter "*.exe").Count
          if ($Count -ne 1) {
            Write-Error "Expected exactly 1 exe, found $Count."
            exit 1
          }
          if (-Not (Test-Path "apps\desktop\release\latest.yml")) {
            Write-Error "latest.yml not found."
            exit 1
          }
          $BlockmapPath = "apps\desktop\release\StreamerHub-Setup-${VERSION}.exe.blockmap"
          if (-Not (Test-Path $BlockmapPath)) {
            Write-Error "Blockmap not found at $BlockmapPath"
            exit 1
          }
          Write-Host "Installer validation passed!"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamerHub-Windows-${{ github.run_number }}
          path: |
            apps/desktop/release/StreamerHub-Setup-*.exe
            apps/desktop/release/StreamerHub-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: StreamerHub ${{ github.ref_name }}
          body: |
            ## StreamerHub ${{ github.ref_name }}

            ### Installation
            Download `StreamerHub-Setup-*.exe` and run it.

            ### What's included
            - StreamerHub desktop application
            - Integrated OBS Studio control
            - Moderator management
            - Social feed, collaborations and calendar

            ### Requirements
            - Windows 10/11 x64
            - OBS Studio with WebSocket plugin (optional)
          files: |
            apps/desktop/release/StreamerHub-Setup-*.exe
            apps/desktop/release/StreamerHub-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
